<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body>
    <!--Offer-->
    <div id="sideBar" class="flex gap-20 bg-black text-white text-center justify-center p-10 m-5">
        <h3>Sign Up and Get 20% Off For Your First Order</h3>
        <p id="close" class="cursor-pointer">X</p>
    </div>

    <!--Navbar-->
    <nav class="flex justify-between items-center p-2 m-1 bg-gray-200 sticky top-0 z-10">

        <div>
            <h1 class="text-4xl">Nostra</h1>

        </div>

        <!--Sidenav-->

        <section id="sidenav" class="fixed z-20 top-0 transition-all duration-1000 bg-blue-300 w-64"
            style="width: 50;height: 100vh; right: -50%;">
            <div class="text-right p-5">
                <p id="closeside" class="inline cursor-pointer">X</p>
            </div>
            <ul class="flex flex-col items-center gap-10">
                <li>
                    <a class="hover:underline hover:text-black" href="">Home</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="">New arrival</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="">Most Wanted</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="">Collections</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="">Contact us</a>
                </li>
            </ul>

        </section>

        <svg id="meanuicon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
            class="size-6 w-6 h-6 md:hidden cursor-pointer">
            <path fill-rule="evenodd"
                d="M3 6.75A.75.75 0 0 1 3.75 6h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 6.75ZM3 12a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 12Zm0 5.25a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75a.75.75 0 0 1-.75-.75Z"
                clip-rule="evenodd" />
        </svg>


        <div>
            <ul class="flex justify-end items-center gap-10 p-5 hidden md:flex">
                <li>
                    <a class="hover:underline hover:text-black" href="">Home</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="">New arrival</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="">Most Wanted</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="">Collections</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="">Contact us</a>
                </li>
            </ul>
        </div>
    </nav>

    <section>
        <div class="relative">
            <ul id="slider">
                <li class="relative">
                    <img src="image/image 1.jpg" alt="">
                </li>
                <li class="relative hidden">
                    <img src="image/image 2.jpg" alt="">
                </li>
                <li class="relative hidden">
                    <img src="image/image 3.jpg" alt="">
                </li>
            </ul>

            <div class="absolute flex h-full w-full top-0 left-0">
                <div class="my-auto w-full flex justify-between">
                    <button onclick="prev()" class="bg-transparent px-5 m-5">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6 h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M6.75 15.75 3 12m0 0 3.75-3.75M3 12h18" />
                        </svg>

                    </button>

                    <button onclick="next()" class="bg-transparent px-5 m-5">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6 h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
                        </svg>

                    </button>
                </div>


            </div>

        </div>
    </section>

    <section class="mt-2 m-2 p-2">
        <h1 class="text-4xl font-bold"><br>Brands</br></h1>
        <div class="flex justify-between md:flex">
            <div>
                <img class="w-20 h-20" src="./image/logo 1.png" alt="">
                <p>Van Heusen</p>
            </div>
            <div>
                <img class="w-20 h-20" src="./image/logo 2.png" alt="">
                <p>H&M</p>
            </div>
            <div>
                <img class="w-20 h-20" src="./image/logo 3.png" alt="">
                <p>Raymond</p>
            </div>
        </div>
    </section>

    <script src="index.js"></script>

</body>

</html>
